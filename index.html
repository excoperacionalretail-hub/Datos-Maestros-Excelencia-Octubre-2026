<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuestionario para gerentes · Retail SA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
<style id="css">
:root{
  --paper:#F6F7F5; --card:#FFFFFF; --ink:#1B2B30; --soft:#5A686C; --line:#DADFDC; --tint:#EEF1EE;
  --acc:#17695A; --acc-soft:#DDF0EA; --blue:#2F6FB0; --blue-soft:#DCE9F6; --bad:#B4461D; --bad-soft:#FBE6DC; --amber:#B7700F; --amber-soft:#FBEBCD; --off:#8C979A; --off-soft:#ECEFEE;
  --purple:#6B4FBB; --teal:#0E7C86; --pink:#B2367A; --olive:#7A6B2E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12181A; --card:#1A2326; --ink:#E6ECEA; --soft:#9AA7AA; --line:#2B3639; --tint:#1F292C;
  --acc:#4CC3A6; --acc-soft:#173A33; --blue:#7FB4EA; --blue-soft:#1C3350; --bad:#F08A5D; --bad-soft:#3D2419; --amber:#F0B650; --amber-soft:#3D2E12; --off:#6D797C; --off-soft:#222C2F;
  --purple:#B39DF5; --teal:#5FC4CC; --pink:#F08BC2; --olive:#CDBB6A;}}
:root[data-theme="dark"]{
  --paper:#12181A; --card:#1A2326; --ink:#E6ECEA; --soft:#9AA7AA; --line:#2B3639; --tint:#1F292C;
  --acc:#4CC3A6; --acc-soft:#173A33; --blue:#7FB4EA; --blue-soft:#1C3350; --bad:#F08A5D; --bad-soft:#3D2419; --amber:#F0B650; --amber-soft:#3D2E12; --off:#6D797C; --off-soft:#222C2F;
  --purple:#B39DF5; --teal:#5FC4CC; --pink:#F08BC2; --olive:#CDBB6A;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.45}
main{max-width:860px;margin:0 auto;padding:22px 16px 120px}
h1{font-family:"Barlow Condensed","Barlow",system-ui,sans-serif;font-weight:600;font-size:34px;line-height:1.05;margin:0 0 4px}
h2{font-size:22px;font-weight:600;margin:0 0 6px}
h3{font-size:16px;font-weight:700;color:var(--acc);margin:18px 0 6px;text-transform:uppercase;letter-spacing:.03em}
p{margin:0 0 10px}
.soft{color:var(--soft)}
.small{font-size:14px}
.steps{display:flex;gap:5px;margin:14px 0 4px}
.steps div{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps div.on{background:var(--acc)}
.steplbl{font-size:14px;color:var(--soft);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 12px}
.field{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.lbl{font-weight:500}.hint{display:block;font-size:13px;color:var(--soft);font-weight:400}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--paper)}
.seg button{font:inherit;font-size:15px;border:0;background:transparent;color:var(--soft);padding:7px 14px;border-radius:999px;cursor:pointer;min-width:52px}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--card)}
.seg.no button[aria-pressed="true"]{background:var(--off);color:var(--card)}
input[type=time],input[type=number],input[type=text],input[type=search],select{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:42px;max-width:100%}
input[type=number]{width:84px}
select{max-width:100%}
.hours{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dayrow{display:grid;grid-template-columns:96px auto 1fr;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.dayrow .h{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--soft)}
.dayrow.off .h{visibility:hidden}
@media (max-width:520px){.dayrow{grid-template-columns:1fr auto}.dayrow .h{grid-column:1 / -1}}
button.btn{font:inherit;font-weight:600;font-size:16px;border-radius:10px;padding:11px 18px;cursor:pointer;border:1px solid var(--acc);background:var(--acc);color:var(--card);min-height:46px}
button.ghost{background:transparent;color:var(--acc)}
button.btn.gray{background:transparent;color:var(--ink);border-color:var(--line)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 8px}
.sec.off{background:var(--off-soft);border-style:dashed}
.sec.unif{background:var(--tint);margin:-2px 0 10px 18px}.sec.unif .field{border:0;padding:2px 0}
.sec .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sec .name{font-weight:600}.sec .cnt{font-size:13px;color:var(--soft)}
.sec .more{margin-top:8px;display:grid;gap:8px;font-size:15px;color:var(--soft)}
.sec.off .more{display:none}
.sec .more .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.otro{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.bar input[type=search]{flex:1;min-width:180px}
.pill{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--tint);color:var(--soft);white-space:nowrap}
.pill.ok{background:var(--acc-soft);color:var(--acc)}.pill.pend{background:var(--amber-soft);color:var(--amber)}
.person.pendc{border-left:5px solid var(--amber)}
.person.flash{animation:flash 2.2s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px var(--amber)}100%{box-shadow:0 0 0 0 transparent}}
.gopend{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--amber);color:#fff;border:0;border-radius:999px;padding:10px 18px;font:inherit;font-weight:700;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;max-width:calc(100% - 24px);white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(128px + env(safe-area-inset-bottom,0px));z-index:21;background:var(--ink);color:var(--paper);border-radius:10px;padding:10px 14px;font-size:14px;max-width:calc(100% - 24px);box-shadow:0 4px 14px rgba(0,0,0,.25)}.pill.baja{background:var(--off-soft);color:var(--soft)}
.person{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 8px}
.person.baja{background:var(--off-soft)}
.person.baja .who span:first-child{text-decoration:line-through;color:var(--soft)}
.person .who{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.person .ref{font-size:13px;color:var(--soft);margin:2px 0 8px}
.person .sel{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.person .sel label{display:flex;flex-direction:column;font-size:12px;color:var(--soft);gap:2px}
.person.baja .sel,.person.baja .zona,.person.baja .obs{display:none}
.zona{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.zona label{display:inline-flex;align-items:center;gap:6px;font-size:14px;border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:var(--paper);cursor:pointer}
.zona label.on{border-color:var(--acc);background:var(--acc-soft)}
.zona input{margin:0}
.obs{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.obs input{flex:1;min-width:180px}
.suclist{display:grid;gap:6px;max-height:60vh;overflow:auto;padding:2px}
.suclist button{font:inherit;font-size:15px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer}
.suclist button:hover{border-color:var(--acc)}
.sum td{padding:6px 0;border-bottom:1px solid var(--line)}.sum td:last-child{text-align:right;font-weight:600}.sum{width:100%;border-collapse:collapse}
.flag{font-size:14px;color:var(--bad);background:var(--bad-soft);border-radius:8px;padding:8px 12px;margin:0 0 8px}
.ok{font-size:14px;color:var(--acc);background:var(--acc-soft);border-radius:8px;padding:8px 12px;margin:0 0 8px}
.msg{font-size:14px;color:var(--soft);min-height:1.2em}
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bottom .in{max-width:860px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.bottom .save{font-size:13px;color:var(--soft);flex:1;text-align:center}
.adds{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.adds input[type=text]{flex:1;min-width:150px}
.export{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chk{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:17px;cursor:pointer}
.chk:last-child{border-bottom:0}.chk input{width:24px;height:24px;accent-color:var(--acc);margin:0;flex:none}
.lnk{font:inherit;font-size:13px;border:0;background:transparent;color:var(--blue);cursor:pointer;padding:2px 4px;text-decoration:underline}
.who-r{display:flex;align-items:center;gap:8px}
.person .ref{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--soft);margin:6px 0 8px}
.person .ref .hint{margin-top:2px}
.btn.small{padding:6px 12px;min-height:36px;font-size:14px}
.odiv{font-weight:700;font-size:17px;color:var(--acc);margin:0 0 4px}
.osec{padding:8px 0;border-top:1px solid var(--line)}.osec b{display:block;margin-bottom:4px}
.oniv{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cj{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px}
.cj.off{background:var(--off-soft);border-style:dashed}
.cjtop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.cjtop input{flex:1;min-width:160px}
.cjin{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end;margin-top:8px}
.cjin label{display:flex;flex-direction:column;font-size:13px;color:var(--soft);gap:3px}.cjin label.wide{flex:1;min-width:220px}.cjin label .hint{display:inline}
.cjin input[type=number]{width:96px}.cjin input[type=text]{width:100%}
.cjcnt{font-size:14px;font-weight:600;color:var(--acc);padding-bottom:10px}
.cjs{font-size:14px;border-radius:8px;padding:8px 12px;margin:10px 0 0}.warn0{background:var(--amber-soft);color:var(--ink)}.good0{background:var(--acc-soft);color:var(--ink)}
.sec .chk{border-bottom:0;padding:6px 0}
.sched{margin:2px 0 6px 36px}
.sline{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.dchips{display:flex;flex-wrap:wrap;gap:5px}
.dc{display:inline-flex;align-items:center;font-size:14px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--paper);cursor:pointer;user-select:none}
.dc input{position:absolute;opacity:0;width:0;height:0}.dc.on{background:var(--acc);border-color:var(--acc);color:var(--card);font-weight:600}
.hh{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--soft)}
.ib{font:inherit;font-size:16px;line-height:1;width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);cursor:pointer}.ib.del{color:var(--bad)}
main.wide{max-width:1320px}
.ot-note{margin:12px 0 0;padding:10px 14px;border-left:4px solid var(--amber);background:var(--amber-soft);border-radius:0 10px 10px 0;font-size:14px;color:var(--ink)}
.ot-wrap{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.ot{min-width:1000px;padding:18px 14px 20px;display:flex;flex-direction:column;align-items:center;--ln:#8A979B}
.ot-root{background:var(--ink);color:var(--paper);font-weight:700;font-size:18px;padding:11px 26px;border-radius:12px;text-align:center}
.ot-stem{width:2px;height:24px;background:var(--ln)}
.ot-row{display:flex;justify-content:center;align-items:flex-start}
.ot-col{position:relative;width:172px;flex:none;padding:24px 7px 0;display:flex;flex-direction:column}
.ot-col::before{content:"";position:absolute;top:0;left:0;right:0;border-top:2px solid var(--ln)}
.ot-col:first-child::before{left:50%}.ot-col:last-child::before{right:50%}
.ot-col::after{content:"";position:absolute;top:0;left:50%;height:24px;border-left:2px solid var(--ln)}
.ot-div{background:hsl(var(--h) 46% 34%);color:#fff;font-weight:700;font-size:15px;line-height:1.2;text-align:center;padding:10px 6px;border-radius:10px}
.ot-kids{margin:0 0 0 12px;padding:10px 0 0 14px;border-left:2px solid hsl(var(--h) 38% 52%)}
.ot-sec{position:relative;background:var(--paper);border:1.5px solid hsl(var(--h) 38% 52%);border-radius:9px;padding:7px 9px;margin:0 0 9px}
.ot-sec:last-child{margin-bottom:0}
.ot-sec::before{content:"";position:absolute;left:-14px;top:17px;width:14px;border-top:2px solid hsl(var(--h) 38% 52%)}
.ot-sn{font-weight:700;font-size:14px;line-height:1.2}
.ot-lv{margin-top:5px;padding-left:9px;border-left:3px solid hsl(var(--h) 40% 70%);font-size:12.5px;line-height:1.3}
.ot-nm{display:block;font-weight:600}.ot-z{display:block;color:var(--soft);font-size:11.5px}
.ot-top{position:relative;width:172px;display:flex;flex-direction:column;align-items:center}
.ot-top>.ot-div{width:100%}
.ot-chain{display:flex;flex-direction:column;align-items:center;width:100%}
.ot-chain .ot-sec{width:100%;margin:0;text-align:center}
.ot-chain .ot-sec::before{display:none}
.ot-cs{width:2px;height:12px;background:hsl(var(--h) 38% 52%)}
.ot-trunk{position:relative;width:2px;height:72px;background:var(--ln)}
.ot-side{position:absolute;left:136px;top:17px;width:172px}
.ot-side::before{content:"";position:absolute;left:-136px;top:19px;width:136px;border-top:2px dashed var(--ln)}
.ot-side .ot-kids{margin-left:12px}
.ot-nm,.ot-sn,.ot-div{overflow-wrap:anywhere}
.ot-phys{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:14px;color:var(--soft)}.ot-phys b{color:var(--ink)}
.ot-tag{background:var(--acc-soft);color:var(--ink);border:1px solid var(--acc);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600}
@media print{@page{size:landscape;margin:10mm}.bottom,.noprint{display:none!important}main,main.wide{max-width:none;padding:0}.ot-wrap{overflow:visible;border:0}.ot{min-width:0;transform-origin:top left}}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.pal{font:inherit;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px 6px 9px;background:var(--paper);color:var(--ink);cursor:pointer;min-height:38px}
.pal i{width:13px;height:13px;border-radius:50%;background:var(--c);flex:none}
.pal.none i{background:transparent;border:2px solid var(--off)}
.pal[aria-pressed="true"]{border-color:var(--c);background:var(--c);color:var(--card)}
.pal[aria-pressed="true"] i{background:var(--card);border-color:var(--card)}
.pal .x{font-weight:700;margin-left:2px;padding:0 5px;opacity:.75;cursor:pointer}
.cgrid{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.addrow{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end}
.addrow label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--soft)}
.addrow input[type=number]{width:86px}.addrow select{min-height:42px;min-width:150px}
.addrow .btn{min-height:42px}
.qty{display:inline-flex;align-items:center;gap:6px}
.qty input[type=number]{width:74px;text-align:center;font-weight:700;font-size:18px}
.qb{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--acc);background:var(--card);color:var(--acc);font-size:24px;font-weight:700;line-height:1;cursor:pointer;padding:0}
.qb:disabled{opacity:.35;cursor:not-allowed}
.btn:disabled{opacity:.45;cursor:not-allowed}
.clist{display:grid;gap:6px}
.crow{display:grid;grid-template-columns:72px auto 1fr auto;align-items:center;gap:6px 8px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.crow.bad{border-color:var(--bad)}.crow.pend{border-color:var(--amber);background:var(--amber-soft)}
.crow select:invalid,.crow select[value=""]{color:var(--soft)}
.crow .cl{font-size:13px;color:var(--soft)}
.crow input[type=number]{min-height:40px;padding:6px 8px;width:72px;font-weight:600}
.crow select{min-height:40px;min-width:0;width:100%}
.crow .dot{width:12px;height:12px;border-radius:50%;background:var(--c);display:inline-block}
.crow .cerr{grid-column:1/-1;font-size:12.5px;color:var(--bad);font-weight:600}
.cb.mini{width:42px;height:42px;cursor:default;border-radius:8px}.cb.mini.un{background:var(--paper);color:var(--soft);border:1.5px dashed var(--amber)}
.rbox{background:var(--tint);border-radius:10px;padding:10px 12px;margin:6px 0 0}
.small.bad{color:var(--bad);font-weight:600}
.cx .x{cursor:pointer;padding:0 4px;color:var(--bad)}
.cb{font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:46px;height:48px;border-radius:9px;cursor:pointer;border:1.5px solid var(--c);background:var(--c);color:var(--card);padding:0}
.cb span{font-size:15px;font-weight:700;line-height:1}.cb small{font-size:9.5px;font-weight:600;line-height:1;opacity:.9;max-width:42px;overflow:hidden;white-space:nowrap}
.cb.un{background:var(--paper);color:var(--soft);border:1.5px dashed var(--off)}
.cb.no{background:var(--off-soft);color:var(--soft);border:1.5px solid var(--line)}.cb.no span{text-decoration:line-through}
.csum{display:grid;gap:4px;font-size:14px;color:var(--soft);margin:0 0 6px}
.cs i{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:middle}.cs b{color:var(--ink)}
.cx{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.cx label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--soft)}.cx label .hint{display:inline}.cx input[type=text]{min-width:200px;color:var(--ink)}.cx .adds{display:flex;gap:6px;flex-wrap:wrap}
details.more{margin-top:10px;font-size:14px;color:var(--soft)}details.more summary{cursor:pointer;color:var(--acc);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
</style>
</head>
<body>
